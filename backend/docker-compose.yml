version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: afriride_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-afriride_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_secure_pass_123}
      POSTGRES_DB: ${DB_NAME:-afriride}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-afriride_admin} -d ${DB_NAME:-afriride}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: afriride_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
